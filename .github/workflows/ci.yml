name: CI Workflow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    name: Lint, Type Check & Run Unit Tests
    runs-on: ubuntu-latest

    env:
      DEBUG: 'True'
      SECRET_KEY: 'django-insecure-ci-test-key-do-not-use-in-production'
      USE_POSTGRES: 'False'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Mypy Type Checker
        run: uv run mypy .

      - name: Run Pytest Test Suite
        run: uv run pytest
